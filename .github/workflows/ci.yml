# CI: reproduz o setup do zero numa máquina limpa e roda toda a verificação.
# É a garantia de que o que está no repositório funciona fora da máquina de desenvolvimento.
name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - name: Instala uv (versão fixada, instalador oficial)
        run: |
          UV_VERSION=$(grep -oP 'UV_VERSION_PINNED="\K[\d.]+' scripts/setup.sh)
          curl -LsSf "https://astral.sh/uv/${UV_VERSION}/install.sh" | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      # Runtime + modelo (~290 MB) em cache, invalidado se o manifesto mudar.
      # O setup.sh verifica o SHA-256 de qualquer forma (cache corrompido = falha).
      - name: Cache dos artefatos do modelo
        uses: actions/cache@v6
        with:
          path: |
            models/runtime
            models/bonsai-1.7b
          key: models-${{ hashFiles('models/manifest.tsv') }}

      - name: Setup do zero (scripts/setup.sh)
        run: SKIP_CHECK=1 ./scripts/setup.sh  # o check.sh completo roda no passo seguinte

      - name: Verificação completa (scripts/check.sh)
        run: ./scripts/check.sh

  # Perfil de escala: os adaptadores Postgres/pgvector passam nas mesmas suítes de contrato do
  # SQLite, contra um Postgres real com pgvector (imagem fixada por digest, a mesma do compose).
  postgres:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        image: pgvector/pgvector:0.8.1-pg17@sha256:3e8b3adfd27b5707128f60956f62a793c3c9326ea8cfaf0eab7adccb5d700b21
        env:
          POSTGRES_USER: emporio
          POSTGRES_PASSWORD: emporio
          POSTGRES_DB: emporio
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U emporio -d emporio"
          --health-interval 3s --health-timeout 3s --health-retries 30
    steps:
      - uses: actions/checkout@v7

      - name: Instala uv (versão fixada, instalador oficial)
        run: |
          UV_VERSION=$(grep -oP 'UV_VERSION_PINNED="\K[\d.]+' scripts/setup.sh)
          curl -LsSf "https://astral.sh/uv/${UV_VERSION}/install.sh" | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Dependências com o extra de escala
        run: uv sync --locked --extra scale

      - name: Suítes de contrato no Postgres + pgvector
        env:
          EMPORIO_TEST_DATABASE_URL: postgresql://emporio:emporio@localhost:5432/emporio
        run: uv run --locked pytest tests/test_postgres.py -m postgres -v

  # Interface web (React + Vite + Tailwind): versões exatas do package-lock.json, Node de web/.nvmrc.
  web:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: web/.nvmrc
      - name: Dependências exatas (npm ci)
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Tipos (tsc)
        run: npm run typecheck
      - name: Testes (vitest)
        run: npm test
      - name: Build (vite)
        run: npm run build

  # A imagem do projeto (deploy/Dockerfile) constrói do zero e responde dentro do container.
  docker:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - name: Compose válido
        run: docker compose -f deploy/docker-compose.yml --profile scale --profile cli config -q

      - name: Build da imagem
        run: docker build -f deploy/Dockerfile -t emporio:ci .

      - name: Build da imagem da interface (Node + nginx)
        run: docker build -f deploy/web.Dockerfile -t emporio-web:ci web

      - name: Smoke test no container (sem modelos)
        run: |
          docker run --rm -e EMBEDDING_BACKEND=none emporio:ci emporio catalog show "Takamine GD20" | tee out.txt
          grep -q "2.199,00" out.txt
          docker run --rm emporio:ci sh -c 'test ! -e /app/_raw && test ! -e /app/.env'
