[project]
name = "emporio"
version = "0.1.0"
description = "Agente de atendimento da Empório da Música (MCP + LLM local/online)"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "mcp[cli]>=1.9",
    "openai>=1.60",
    "httpx2>=2.16.0",  # cliente HTTP do openai 3.x; usado diretamente para /props e nos testes
    "pandas>=2.2",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "python-dotenv>=1.0",
    "pyyaml>=6.0",
    "rapidfuzz>=3.9",
    "pypdf>=4.2",
    "rich>=13.7",
]

[project.optional-dependencies]
# Perfil de escala (Postgres + pgvector): `uv sync --extra scale`. O padrão continua sem servidor.
scale = ["psycopg[binary]>=3.2"]

[project.scripts]
emporio = "emporio.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "ruff>=0.5",
]

[tool.uv]
# Desenvolvido com uv 0.12.21 (ver scripts/setup.sh). O uv.lock garante versões exatas.
required-version = ">=0.12"
# Sempre o CPython gerenciado pelo uv (versão exata de .python-version), nunca o do sistema.
python-preference = "only-managed"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/emporio"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-m 'not integration'"   # padrão rápido; integração: pytest -m integration
markers = [
    "integration: sobe o LLM local real (lento, requer artefatos baixados)",
    "postgres: perfil de escala; roda com EMPORIO_TEST_DATABASE_URL (Postgres + pgvector)",
]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.format]
docstring-code-format = true
line-ending = "lf"

[tool.ruff.lint]
# Conjunto amplo: correção, segurança, modernização, simplificação e estilo de docstring.
select = [
    "E", "W",   # pycodestyle
    "F",        # pyflakes
    "I",        # isort
    "UP",       # pyupgrade
    "B",        # bugbear
    "S",        # bandit (segurança)
    "N",        # nomes (pep8-naming)
    "PL",       # pylint
    "SIM",      # simplificações
    "C4",       # comprehensions
    "RUF",      # regras do ruff
    "PT",       # pytest
    "PTH",      # pathlib em vez de os.path
    "ARG",      # argumentos não usados
    "BLE",      # except Exception genérico
    "TRY",      # boas práticas de exceções
    "RET",      # retornos
    "PIE", "PERF", "FURB",
    "DTZ",      # datetime sem fuso
    "LOG", "G", # logging
    "ERA",      # código comentado
    "ISC",      # concatenação implícita de strings
    "TID",      # imports
    "T10",      # debugger esquecido
    "FBT",      # booleanos posicionais
    "D",        # docstrings (estilo; presença não é obrigatória, ver ignore)
]
ignore = [
    "D1",       # docstring obrigatória em tudo: preferimos docstrings onde agregam valor
    "D401",     # "imperative mood" assume inglês; as docstrings são em português
    "TRY003",   # mensagens de erro descritivas em PT-BR são intencionais
    "PLR0913",  # funções de domínio com vários filtros opcionais (keyword-only)
    "ISC001",   # conflita com o formatter
]
# Caracteres tipográficos usados de propósito nos textos em português.
allowed-confusables = ["×", "–", "—", "→", "‐"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.isort]
known-first-party = ["emporio", "tests"]

[tool.ruff.lint.flake8-pytest-style]
fixture-parentheses = false
mark-parentheses = false

[tool.ruff.lint.per-file-ignores]
"tests/**" = [
    "S101",     # assert é o mecanismo do pytest
    "PLR2004",  # valores esperados literais deixam o teste legível
    "S603", "S607", "S310",  # testes executam scripts/subprocessos e chamam o servidor local
    "PLC0415",  # imports locais isolam dependências em testes específicos
    "ARG001", "ARG002",  # fixtures usadas pelo efeito colateral
]
"src/emporio/mcp_server/server.py" = [
    "FBT001", "FBT002",  # parâmetros das tools viram JSON Schema e são sempre chamados por nome
    "PLR0917",
]
"scripts/**" = [
    "T20",      # scripts imprimem resultados no terminal
    "PLR2004",
]
